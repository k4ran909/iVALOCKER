name: Build & release

# Builds the Windows installer and the portable exe.
#  - on every push / pull request: build + test, files available as workflow artifacts
#  - when you push a tag like v3.2: also publishes a GitHub Release with both files attached
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build portable exe
        run: python install_and_build/build.py

      - name: Build installer
        run: python install_and_build/build.py --installer

      - uses: actions/upload-artifact@v4
        with:
          name: iVALOCKER-windows
          path: |
            dist/iVALOCKER_k4ran909.exe
            dist/iVALOCKER_Setup_*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iVALOCKER_k4ran909.exe
            dist/iVALOCKER_Setup_*.exe
          generate_release_notes: true
